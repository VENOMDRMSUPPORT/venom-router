<!-- @dsCard group="Foundations" viewport="700x170" subtitle="Base-4 spacing scale — no off-scale values" name="Spacing" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Venom DS — Spacing</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px;background:var(--surface-canvas)}.row{display:flex;align-items:flex-end;gap:10px}.s{display:flex;flex-direction:column;align-items:center;gap:4px}.bar{width:22px;background:var(--accent-subtle-bg);border:1px solid var(--accent-default);border-radius:2px}.t{font-family:var(--font-family-mono);font-size:9px;color:var(--text-muted)}</style>
</head><body>
<div class="row">
  <div class="s"><div class="bar" style="height:4px"></div><span class="t">1·4</span></div>
  <div class="s"><div class="bar" style="height:8px"></div><span class="t">2·8</span></div>
  <div class="s"><div class="bar" style="height:12px"></div><span class="t">3·12</span></div>
  <div class="s"><div class="bar" style="height:16px"></div><span class="t">4·16</span></div>
  <div class="s"><div class="bar" style="height:20px"></div><span class="t">5·20</span></div>
  <div class="s"><div class="bar" style="height:24px"></div><span class="t">6·24</span></div>
  <div class="s"><div class="bar" style="height:32px"></div><span class="t">8·32</span></div>
  <div class="s"><div class="bar" style="height:40px"></div><span class="t">10·40</span></div>
  <div class="s"><div class="bar" style="height:48px"></div><span class="t">12·48</span></div>
  <div class="s"><div class="bar" style="height:64px"></div><span class="t">16·64</span></div>
  <div class="s"><div class="bar" style="height:80px"></div><span class="t">20·80</span></div>
</div>
<p class="vn-caption" style="margin:8px 0 0">--space-N · padding, gaps and layout only ever use these steps; density switches control metrics separately.</p>
</body></html>
