<!-- @dsCard group="Colors" viewport="700x150" subtitle="Tier accents — the only way a tier is colored, anywhere" name="Tier accents" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Venom DS — Tier accents</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:12px;background:var(--surface-canvas)}.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}.note{font-size:11px;color:var(--text-muted)}.id{font-family:var(--font-family-mono);font-size:10px;color:var(--text-muted)}</style>
</head><body>
<div class="row">
  <span class="vn-badge vn-badge--tier-lite">LITE</span><span class="id">venom/lite · tier.lite.*</span>
  <span class="vn-badge vn-badge--tier-pro" style="margin-left:12px">PRO</span><span class="id">venom/pro · tier.pro.*</span>
  <span class="vn-badge vn-badge--tier-max" style="margin-left:12px">MAX</span><span class="id">venom/max · tier.max.*</span>
</div>
<div class="row" data-theme="venom-light" style="background:var(--surface-canvas);padding:8px;border-radius:6px">
  <span class="vn-badge vn-badge--tier-lite">LITE</span>
  <span class="vn-badge vn-badge--tier-pro">PRO</span>
  <span class="vn-badge vn-badge--tier-max">MAX</span>
  <span class="note">light theme</span>
</div>
<div class="note">The accent green never labels a tier; tiers never use status colors. Only these three public IDs exist — no other tier name is ever advertised.</div>
</body></html>
