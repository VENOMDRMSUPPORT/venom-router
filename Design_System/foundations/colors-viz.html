<!-- @dsCard group="Colors" viewport="700x180" subtitle="Categorical (provider/tier series) + sequential (quota heat) ramps" name="Data-viz ramps" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Venom DS — Data-viz ramps</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:12px;background:var(--surface-canvas)}.lbl{font-family:var(--font-family-mono);font-size:10px;color:var(--text-muted);margin:4px 0 4px}.ramp{display:flex;gap:4px}.ramp i{height:22px;flex:1;border-radius:3px}</style>
</head><body>
<div class="lbl">viz.cat.1–8 — categorical (series stay distinguishable in all themes and under CVD)</div>
<div class="ramp">
  <i style="background:var(--viz-cat-1)"></i><i style="background:var(--viz-cat-2)"></i><i style="background:var(--viz-cat-3)"></i><i style="background:var(--viz-cat-4)"></i>
  <i style="background:var(--viz-cat-5)"></i><i style="background:var(--viz-cat-6)"></i><i style="background:var(--viz-cat-7)"></i><i style="background:var(--viz-cat-8)"></i>
</div>
<div class="lbl">viz.seq.1–7 — sequential (usage/quota intensity; never encodes unknown — unknown renders hatched, not as a value)</div>
<div class="ramp">
  <i style="background:var(--viz-seq-1)"></i><i style="background:var(--viz-seq-2)"></i><i style="background:var(--viz-seq-3)"></i><i style="background:var(--viz-seq-4)"></i>
  <i style="background:var(--viz-seq-5)"></i><i style="background:var(--viz-seq-6)"></i><i style="background:var(--viz-seq-7)"></i>
</div>
<div class="lbl" data-theme="venom-light" style="background:var(--surface-canvas);padding:6px;border-radius:6px;display:block">
  <div class="ramp"><i style="background:var(--viz-cat-1)"></i><i style="background:var(--viz-cat-2)"></i><i style="background:var(--viz-cat-3)"></i><i style="background:var(--viz-cat-4)"></i><i style="background:var(--viz-cat-5)"></i><i style="background:var(--viz-cat-6)"></i><i style="background:var(--viz-cat-7)"></i><i style="background:var(--viz-cat-8)"></i></div>
</div>
</body></html>
