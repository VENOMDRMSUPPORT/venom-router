<!-- @dsCard group="Colors" viewport="700x210" subtitle="Three background depths × three themes" name="Surfaces" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Venom DS — Surfaces</title><link rel="stylesheet" href="../styles.css">
<style>
  body{background:var(--surface-canvas);padding:0;margin:0}
  .row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .theme{background:var(--surface-canvas);border:1px solid var(--border-default);border-radius:var(--radius-md);padding:10px;color:var(--text-primary)}
  .sw{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:11px;color:var(--text-secondary)}
  .chip{width:34px;height:22px;border-radius:4px;border:1px solid var(--border-default);flex:none}
  .name{font-family:var(--font-family-mono);font-size:10px}
</style></head><body>
<div class="row">
  <div class="theme" data-theme="venom-dark"><span class="vn-overline">venom-dark</span>
    <div class="sw"><span class="chip" style="background:var(--surface-canvas)"></span><span class="name">surface.canvas</span></div>
    <div class="sw"><span class="chip" style="background:var(--surface-primary)"></span><span class="name">surface.primary</span></div>
    <div class="sw"><span class="chip" style="background:var(--surface-secondary)"></span><span class="name">surface.secondary</span></div>
    <div class="sw"><span class="chip" style="background:var(--surface-raised)"></span><span class="name">surface.raised</span></div>
    <div class="sw"><span class="chip" style="background:var(--surface-sunken)"></span><span class="name">surface.sunken</span></div>
  </div>
  <div class="theme" data-theme="venom-light"><span class="vn-overline">venom-light</span>
    <div class="sw"><span class="chip" style="background:var(--surface-canvas)"></span><span class="name">surface.canvas</span></div>
    <div class="sw"><span class="chip" style="background:var(--surface-primary)"></span><span class="name">surface.primary</span></div>
    <div class="sw"><span class="chip" style="background:var(--surface-secondary)"></span><span class="name">surface.secondary</span></div>
    <div class="sw"><span class="chip" style="background:var(--surface-raised)"></span><span class="name">surface.raised</span></div>
    <div class="sw"><span class="chip" style="background:var(--surface-sunken)"></span><span class="name">surface.sunken</span></div>
  </div>
  <div class="theme" data-theme="venom-hc"><span class="vn-overline">venom-hc</span>
    <div class="sw"><span class="chip" style="background:var(--surface-canvas)"></span><span class="name">surface.canvas</span></div>
    <div class="sw"><span class="chip" style="background:var(--surface-primary)"></span><span class="name">surface.primary</span></div>
    <div class="sw"><span class="chip" style="background:var(--surface-secondary)"></span><span class="name">surface.secondary</span></div>
    <div class="sw"><span class="chip" style="background:var(--surface-raised)"></span><span class="name">surface.raised</span></div>
    <div class="sw"><span class="chip" style="background:var(--surface-sunken)"></span><span class="name">surface.sunken</span></div>
  </div>
</div>
</body></html>
