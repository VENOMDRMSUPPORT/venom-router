name: CI

# Speed structure (why this shape):
#   - The full static gate (`task gate`: gofmt, goimports, go vet, golangci-lint,
#     go test — incl. the layering + no-slug-switch tests) runs on LINUX ONLY.
#     gofmt/goimports are OS-independent: they format every .go file by name
#     regardless of build tags, so windows-tagged files (platform_windows.go,
#     the windows lock, keyring_windows_test.go, …) ARE format-checked here.
#   - The race job runs on BOTH Linux and Windows. `go test -race ./...` COMPILES
#     AND RUNS every test, so the windows race job is the full compile+test
#     coverage of windows-tagged code — it is what keeps the Windows build/tests
#     green now that the (slow) windows static-gate job has been dropped.
#   Accepted tradeoff for speed: golangci-lint / go vet STATIC ANALYSIS is not run
#   on windows-ONLY-tagged source files (they are still compiled + tested on Windows
#   by the race job, and format-checked on Linux). Reinstate a windows gate job if a
#   windows-only lint regression ever slips through.
#   Gate LOGIC still lives entirely in Taskfile.yml (`task gate` / `task test-race`) —
#   the P0-TEST-001 "one command, no gate logic in the workflow" invariant holds.
#
# 2026-07-28 GOVERNOR DECISION — self-hosted runner (owner-authorized, cost-driven):
#   GitHub-hosted minutes were exhausted (private repo, 2000 min/month free tier;
#   windows-latest costs 2x). Owner chose the fast path over standing up a second
#   genuine-Linux self-hosted runner: ALL FOUR jobs below now run on ONE Windows
#   self-hosted runner (label `venom`) instead of GitHub-hosted ubuntu-latest/
#   windows-latest. Zero GitHub Actions minutes are billed for self-hosted runners
#   regardless of OS or duration.
#   ⚠️ KNOWN, DISCLOSED GAP: this means NOTHING in CI runs on genuine Linux anymore.
#   The project has been bitten by this exact class of bug before (a `*_windows.go`
#   filename carries an implicit GOOS build constraint invisible to a Windows-only
#   gate — see venom-review-heuristics memory) — that failure mode can now ONLY be
#   caught by an eventual real Linux runner (e.g. a WSL2 Ubuntu self-hosted runner,
#   deferred; or restoring ubuntu-latest once billing allows). Until then, run
#   `GOOS=linux go vet ./...` / `GOOS=linux go build ./...` locally before trusting
#   any change that touches build-tagged files.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"

# A new push to a ref cancels an in-progress run for that same ref, so rapid
# pushes don't queue up redundant runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.5"
  # Pinned tool versions. Bumping any of these rotates the tool cache key below,
  # forcing a one-time rebuild of that tool.
  GOLANGCI_LINT_VERSION: "v2.12.2"
  GOIMPORTS_VERSION: "v0.48.0"
  TASK_VERSION: "3.52.0"

jobs:
  # The single blocking static-invariants gate (P0-TEST-001), Linux-only — see the
  # header note for why one OS is sufficient for the STATIC checks. All gate logic
  # lives in Taskfile.yml's `gate` target; this job only invokes it.
  gate:
    name: gate (self-hosted)
    runs-on: [self-hosted, venom]
    steps:
      - name: Checkout (with submodules, for the pinned third_party/bifrost)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # Build + module cache keyed on go.sum: makes go vet / go test /
          # golangci-lint reuse compiled packages (incl. the Bifrost submodule)
          # across runs instead of recompiling everything cold.
          cache: true

      - name: Set up Task (pinned, prebuilt binary — no from-source build)
        uses: arduino/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate GOPATH/bin (where go install places the pinned tools)
        id: gobin
        shell: bash
        run: echo "dir=$(go env GOPATH)/bin" >> "$GITHUB_OUTPUT"

      - name: Cache the pinned lint tools (golangci-lint, goimports)
        id: lint-tools-cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.gobin.outputs.dir }}
          key: lint-tools-${{ runner.os }}-go${{ env.GO_VERSION }}-glci${{ env.GOLANGCI_LINT_VERSION }}-goimports${{ env.GOIMPORTS_VERSION }}

      - name: Install the pinned lint tools (only on a cache miss)
        if: steps.lint-tools-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}
          go install golang.org/x/tools/cmd/goimports@${{ env.GOIMPORTS_VERSION }}

      - name: Cache the golangci-lint analysis cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/golangci-lint
          key: golangci-analysis-${{ runner.os }}-glci${{ env.GOLANGCI_LINT_VERSION }}-${{ hashFiles('go.sum', '.golangci.yml') }}
          restore-keys: |
            golangci-analysis-${{ runner.os }}-glci${{ env.GOLANGCI_LINT_VERSION }}-

      - name: Run the static gate
        run: task gate

  # Race detector on BOTH OSes. CGO_ENABLED=1 is a build requirement of Go's race
  # detector itself. `go test -race ./...` compiles AND runs every test, so the
  # windows leg is the full compile+test coverage of windows-tagged code.
  race:
    name: race detector (self-hosted)
    runs-on: [self-hosted, venom]
    steps:
      - name: Checkout (with submodules, for the pinned third_party/bifrost)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Task (pinned, prebuilt binary — no from-source build)
        uses: arduino/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # ubuntu-latest ships gcc already. windows-latest ships MinGW but not always
      # on PATH for a bare `gcc` invocation; add it via chocolatey only if it isn't
      # already resolvable, so cgo has a compiler to build the race runtime with.
      - name: Ensure a C toolchain is available for cgo (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) {
            choco install mingw -y
          }

      - name: Run the race detector
        run: task test-race

  # P2a-DS-004: continuous CI coverage for the frontend, finally wired in.
  # A SEPARATE job from `gate`/`race` — it runs in PARALLEL with them (no
  # `needs:`), so the Go jobs above stay exactly as fast as before; nothing
  # here folds into `task gate`. Design_System/dist is not committed, so it
  # must be built here (npm ci + npm run build) before the dashboard's
  # `file:` dependency on it will resolve. Also re-verifies the Design
  # System's own 12/12 gate (`npm run validate`) as a pinned prerequisite,
  # then builds + embeds the dashboard into internal/httpui/dist and runs
  # the one Go test that proves the real embed is served end-to-end
  # (P2a-UI-001) — the only place this repo's CI touches both Node and Go
  # in the same job, and only for that one narrow, targeted test run.
  dashboard:
    name: dashboard (design system + app)
    runs-on: [self-hosted, venom]
    steps:
      - name: Checkout (with submodules, for the pinned third_party/bifrost)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            Design_System/package-lock.json
            dashboard/package-lock.json

      # P2a-DS-005: fail fast, before anything is installed/built — this
      # script has zero deps (Node stdlib + git only). Checks (1) no
      # internal-path imports, (2) no vendored DS component/source copies,
      # (3) Design_System/ is byte-clean (read-only), (4) the pinned
      # version hasn't silently drifted. See dashboard/CONSUMPTION.md.
      - name: Check @venom/design-system adherence (read-only, public exports only)
        working-directory: dashboard
        run: npm run check:ds-adherence

      - name: Install Design_System dependencies
        working-directory: Design_System
        run: npm ci

      - name: "Build Design_System (dist/ — the dashboard's file: dependency needs it)"
        working-directory: Design_System
        run: npm run build

      - name: Re-verify the Design System gate (12/12, pinned prerequisite)
        working-directory: Design_System
        run: npm run validate

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build the dashboard
        working-directory: dashboard
        run: npm run build

      - name: Lint the dashboard (incl. the no-raw-values guardrail, P2a-DS-003)
        working-directory: dashboard
        run: npm run lint

      - name: Test the dashboard (theme/density runtime + smoke inventory, 3 themes x 2 densities)
        working-directory: dashboard
        run: npm run test

      - name: Set up Go (for the embed pipeline's Go-side test only)
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Task (pinned, prebuilt binary — no from-source build)
        uses: arduino/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + embed the dashboard into internal/httpui/dist (P2a-UI-001)
        run: task dashboard:build-embed

      - name: Run the real-embed Go test (proves the SPA is served end-to-end)
        run: go test ./internal/httpui/... ./internal/app/... -run 'TestBoot_ServesEmbeddedDashboardSPA|TestNew_UsesEmbeddedDist' -v
