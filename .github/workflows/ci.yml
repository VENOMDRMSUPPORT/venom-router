name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.5"

jobs:
  gate:
    name: gate (self-hosted Linux)
    # SECURITY (public repo + self-hosted runners): never let a fork's PR execute
    # code on the runner host. Run only for non-PR events (push/schedule/dispatch)
    # or PRs whose head branch lives in THIS repo (i.e. not a fork). GitHub cannot
    # express "same-repo PRs only" at the trigger level, so it is gated per job.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, venom-linux]
    timeout-minutes: 8
    steps:
      - name: Checkout with pinned Bifrost submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify CI workflow contract
        run: node .github/scripts/verify-ci-contract.mjs

      - name: Verify pinned Linux toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(go version)" = "go version go1.26.5 linux/amd64"
          node --version | grep -E "^v20\."
          task --version | grep -F "3.52.0"
          golangci-lint --version | grep -F "2.12.2"
          go version -m "$(command -v goimports)" | grep -E "golang.org/x/tools[[:space:]]+v0.48.0"
          git --version

      - name: Run the authoritative static gate
        run: task gate

      - name: Check Design System adherence
        working-directory: dashboard
        run: npm run check:ds-adherence

      - name: Install Design System dependencies
        working-directory: Design_System
        run: npm ci

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build and embed dashboard once
        run: task dashboard:build-embed

      - name: Validate Design System
        working-directory: Design_System
        run: npm run validate

      - name: Lint dashboard
        working-directory: dashboard
        run: npm run lint

      - name: Test dashboard
        working-directory: dashboard
        run: npm run test

      # P6-TEST-001 (1b). ONLY chromium: the suites declare a single chromium
      # project, and pulling firefox/webkit would triple the download for
      # ⛔ THE REAL-BROWSER SUITES ARE NOT WIRED HERE YET, AND THIS IS THE REASON.
      #
      # P6-TEST-001 ships three Playwright suites that DO pass locally
      # (`cd dashboard && npx playwright test` → 28 passed): real-browser axe
      # with color-contrast actually evaluated, the five critical flows, and the
      # theme × density visual matrix. Wiring them into this job was attempted
      # twice and both attempts are recorded so nobody repeats them:
      #
      #   run 30701375330 — `npx playwright install --with-deps chromium`
      #     fails before downloading a byte: --with-deps re-execs under sudo to
      #     apt-install OS libraries and this runner has no passwordless sudo
      #     ("sudo: a password is required").
      #   run 30701469181 — `npx playwright install chromium` (no --with-deps)
      #     downloads fine, then every one of the 20 tests dies at launch with
      #     "libnspr4.so: cannot open shared object file". The browser binary is
      #     present; the host's shared libraries are not.
      #
      # UNBLOCKING IT IS A ONE-TIME HOST CHANGE ON venom-linux, and only the
      # machine's owner can make it:
      #
      #   sudo npx playwright install-deps chromium     # or: sudo apt-get install -y libnspr4 libnss3 libasound2t64
      #
      # After that, re-add the two steps below and this job enforces the browser
      # suites on every push:
      #
      #   - name: Install the chromium build Playwright pins
      #     working-directory: dashboard
      #     run: npx playwright install chromium
      #   - name: Dashboard a11y + critical flows (real browser)
      #     working-directory: dashboard
      #     run: npm run test:e2e
      #
      # The suites are deliberately NOT made `continue-on-error` in the meantime:
      # a step that reports success while running nothing is worse than an
      # absent step, because it reads as coverage. Until the libraries land, the
      # browser layer is LOCAL-ONLY evidence and is recorded as such in
      # docs/evidence/P6-TEST-002-operate-without-terminal-runbook.md.
      #
      # tests/visual needs one further step even after the libraries: Playwright
      # baselines are per-platform (`-chromium-linux` vs the committed
      # `-chromium-win32`), so seed them once on venom-linux with
      # `npm run test:visual:update` before adding `npm run test:visual`.

      - name: Prove the embedded dashboard is served
        run: go test ./internal/httpui/... ./internal/app/... -run 'TestBoot_ServesEmbeddedDashboardSPA|TestNew_UsesEmbeddedDist' -v

  windows-smoke:
    name: windows smoke (self-hosted)
    # SECURITY (public repo + self-hosted runners): same fork-PR guard as `gate`.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, venom]
    timeout-minutes: 6
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout with pinned Bifrost submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up pinned Go without Actions cache
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Verify Windows prerequisites
        shell: powershell
        run: |
          if ((go version) -ne 'go version go1.26.5 windows/amd64') { throw "Unexpected Go: $(go version)" }
          git --version

      - name: Run Windows smoke tests
        run: go test ./...
