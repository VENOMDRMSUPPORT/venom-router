name: CI

# Speed structure (why this shape):
#   - The full static gate (`task gate`: gofmt, goimports, go vet, golangci-lint,
#     go test — incl. the layering + no-slug-switch tests) runs on LINUX ONLY.
#     gofmt/goimports are OS-independent: they format every .go file by name
#     regardless of build tags, so windows-tagged files (platform_windows.go,
#     the windows lock, keyring_windows_test.go, …) ARE format-checked here.
#   - The race job runs on BOTH Linux and Windows. `go test -race ./...` COMPILES
#     AND RUNS every test, so the windows race job is the full compile+test
#     coverage of windows-tagged code — it is what keeps the Windows build/tests
#     green now that the (slow) windows static-gate job has been dropped.
#   Accepted tradeoff for speed: golangci-lint / go vet STATIC ANALYSIS is not run
#   on windows-ONLY-tagged source files (they are still compiled + tested on Windows
#   by the race job, and format-checked on Linux). Reinstate a windows gate job if a
#   windows-only lint regression ever slips through.
#   Gate LOGIC still lives entirely in Taskfile.yml (`task gate` / `task test-race`) —
#   the P0-TEST-001 "one command, no gate logic in the workflow" invariant holds.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"

# A new push to a ref cancels an in-progress run for that same ref, so rapid
# pushes don't queue up redundant runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.5"
  # Pinned tool versions. Bumping any of these rotates the tool cache key below,
  # forcing a one-time rebuild of that tool.
  GOLANGCI_LINT_VERSION: "v2.12.2"
  GOIMPORTS_VERSION: "v0.48.0"
  TASK_VERSION: "3.52.0"

jobs:
  # The single blocking static-invariants gate (P0-TEST-001), Linux-only — see the
  # header note for why one OS is sufficient for the STATIC checks. All gate logic
  # lives in Taskfile.yml's `gate` target; this job only invokes it.
  gate:
    name: gate (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules, for the pinned third_party/bifrost)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # Build + module cache keyed on go.sum: makes go vet / go test /
          # golangci-lint reuse compiled packages (incl. the Bifrost submodule)
          # across runs instead of recompiling everything cold.
          cache: true

      - name: Set up Task (pinned, prebuilt binary — no from-source build)
        uses: arduino/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate GOPATH/bin (where go install places the pinned tools)
        id: gobin
        shell: bash
        run: echo "dir=$(go env GOPATH)/bin" >> "$GITHUB_OUTPUT"

      - name: Cache the pinned lint tools (golangci-lint, goimports)
        id: lint-tools-cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.gobin.outputs.dir }}
          key: lint-tools-${{ runner.os }}-go${{ env.GO_VERSION }}-glci${{ env.GOLANGCI_LINT_VERSION }}-goimports${{ env.GOIMPORTS_VERSION }}

      - name: Install the pinned lint tools (only on a cache miss)
        if: steps.lint-tools-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}
          go install golang.org/x/tools/cmd/goimports@${{ env.GOIMPORTS_VERSION }}

      - name: Cache the golangci-lint analysis cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/golangci-lint
          key: golangci-analysis-${{ runner.os }}-glci${{ env.GOLANGCI_LINT_VERSION }}-${{ hashFiles('go.sum', '.golangci.yml') }}
          restore-keys: |
            golangci-analysis-${{ runner.os }}-glci${{ env.GOLANGCI_LINT_VERSION }}-

      - name: Run the static gate
        run: task gate

  # Race detector on BOTH OSes. CGO_ENABLED=1 is a build requirement of Go's race
  # detector itself. `go test -race ./...` compiles AND runs every test, so the
  # windows leg is the full compile+test coverage of windows-tagged code.
  race:
    name: race detector (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Checkout (with submodules, for the pinned third_party/bifrost)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Task (pinned, prebuilt binary — no from-source build)
        uses: arduino/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # ubuntu-latest ships gcc already. windows-latest ships MinGW but not always
      # on PATH for a bare `gcc` invocation; add it via chocolatey only if it isn't
      # already resolvable, so cgo has a compiler to build the race runtime with.
      - name: Ensure a C toolchain is available for cgo (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) {
            choco install mingw -y
          }

      - name: Run the race detector
        run: task test-race
