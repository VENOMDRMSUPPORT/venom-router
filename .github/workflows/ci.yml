name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The single blocking static-invariants gate (P0-TEST-001): gofmt,
  # goimports, go vet, golangci-lint (incl. the layering test and the
  # no-slug-switch check, both of which run as part of `go test ./...`).
  # All gate LOGIC lives in Taskfile.yml's `gate` target — this workflow
  # only invokes it, on both Windows and Linux.
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Checkout (with submodules, for the pinned third_party/bifrost)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Install goimports (pinned)
        run: go install golang.org/x/tools/cmd/goimports@v0.48.0

      - name: Install golangci-lint (pinned)
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Install Task (pinned)
        run: go install github.com/go-task/task/v3/cmd/task@v3.52.0

      - name: Run the static gate
        run: task gate

  # Race detector (test-only). CGO_ENABLED=1 is a build requirement of
  # Go's race detector itself — production builds stay CGO_ENABLED=0;
  # these do not conflict. Kept as its own job, separate from `gate`,
  # since it needs a working C toolchain to even compile, and `gate`
  # must stay green on hosts without one.
  race:
    name: race detector (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Checkout (with submodules, for the pinned third_party/bifrost)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Install Task (pinned)
        run: go install github.com/go-task/task/v3/cmd/task@v3.52.0

      # ubuntu-latest ships gcc already. windows-latest ships MinGW but
      # not always on PATH for a bare `gcc` invocation; add it via
      # chocolatey if it isn't already resolvable, so cgo has a compiler
      # to build the race runtime with.
      - name: Ensure a C toolchain is available for cgo (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) {
            choco install mingw -y
          }

      - name: Run the race detector
        run: task test-race
