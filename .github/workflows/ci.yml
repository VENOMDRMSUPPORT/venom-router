name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
  # Manual dispatch exists ONLY for the visual-baselines-linux job below —
  # the push/PR-triggered jobs also run on a dispatch (they gate the same
  # commit and should be green anyway), but only a maintainer can dispatch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.5"

jobs:
  gate:
    name: gate (self-hosted Linux)
    # SECURITY (public repo + self-hosted runners): never let a fork's PR execute
    # code on the runner host. Run only for non-PR events (push/schedule/dispatch)
    # or PRs whose head branch lives in THIS repo (i.e. not a fork). GitHub cannot
    # express "same-repo PRs only" at the trigger level, so it is gated per job.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, venom-linux]
    timeout-minutes: 8
    steps:
      - name: Checkout with pinned Bifrost submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify CI workflow contract
        run: node .github/scripts/verify-ci-contract.mjs

      - name: Verify pinned Linux toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(go version)" = "go version go1.26.5 linux/amd64"
          node --version | grep -E "^v20\."
          task --version | grep -F "3.52.0"
          golangci-lint --version | grep -F "2.12.2"
          go version -m "$(command -v goimports)" | grep -E "golang.org/x/tools[[:space:]]+v0.48.0"
          git --version

      - name: Run the authoritative static gate
        run: task gate

      - name: Check Design System adherence
        working-directory: dashboard
        run: npm run check:ds-adherence

      - name: Install Design System dependencies
        working-directory: Design_System
        run: npm ci

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build and embed dashboard once
        run: task dashboard:build-embed

      - name: Validate Design System
        working-directory: Design_System
        run: npm run validate

      - name: Lint dashboard
        working-directory: dashboard
        run: npm run lint

      - name: Test dashboard
        working-directory: dashboard
        run: npm run test

      # P6-TEST-001 (1b). ONLY chromium: the suites declare a single chromium
      # project, and pulling firefox/webkit would triple the download for
      # nothing. `npm ci` above does not fetch browsers, so the pinned build is
      # installed explicitly before the suites run.
      #
      # Do NOT add `--with-deps` to that install: on this runner it re-execs
      # under sudo to apt-install OS libraries, and the runner has no
      # passwordless sudo ("sudo: a password is required"). The host's shared
      # libraries were installed once as root with `npx playwright
      # install-deps chromium`, so the plain browser install is all CI needs.
      #
      # The suites are deliberately NOT `continue-on-error`: a step that
      # reports success while running nothing is worse than an absent step,
      # because it reads as coverage. If the browser layer breaks here, the
      # build must fail loudly.

      - name: Install the chromium build Playwright pins
        working-directory: dashboard
        run: npx playwright install chromium

      - name: Dashboard a11y + critical flows (real browser)
        working-directory: dashboard
        run: npm run test:e2e

      - name: Dashboard visual regression (real browser)
        working-directory: dashboard
        run: npm run test:visual

      - name: Prove the embedded dashboard is served
        run: go test ./internal/httpui/... ./internal/app/... -run 'TestBoot_ServesEmbeddedDashboardSPA|TestNew_UsesEmbeddedDist' -v

  # Regenerates the *-linux.png visual baselines ON the linux runner — the
  # only host whose rendering they are valid for — and publishes them as an
  # artifact for a maintainer to download, review, and commit. It never
  # commits anything itself: a baseline is a reviewed fixture, not a build
  # output.
  visual-baselines-linux:
    name: visual baselines (linux, manual dispatch)
    # SECURITY (public repo + self-hosted runners): dispatch-only — this job
    # never runs for pushes or PRs, so no fork code can ever reach it; only a
    # maintainer triggering "Run workflow" on a ref of THIS repo.
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64, venom-linux]
    timeout-minutes: 10
    steps:
      - name: Checkout with pinned Bifrost submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Design System dependencies
        working-directory: Design_System
        run: npm ci

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      # Same rationale as the gate job's install: chromium only, and never
      # `--with-deps` (the runner has no passwordless sudo; the OS libraries
      # were installed once as root with `npx playwright install-deps`).
      - name: Install the chromium build Playwright pins
        working-directory: dashboard
        run: npx playwright install chromium

      # `--update-snapshots` rewrites the linux baselines in the working
      # tree (the suite's own webServer builds the dashboard first).
      - name: Regenerate the linux visual baselines
        working-directory: dashboard
        run: npm run test:visual:update

      - name: Upload the regenerated linux baselines
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-linux
          path: dashboard/tests/visual/appearance.spec.ts-snapshots/*-linux.png
          if-no-files-found: error

  windows-smoke:
    name: windows smoke (self-hosted)
    # SECURITY (public repo + self-hosted runners): same fork-PR guard as `gate`.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, venom]
    timeout-minutes: 6
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout with pinned Bifrost submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up pinned Go without Actions cache
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Verify Windows prerequisites
        shell: powershell
        run: |
          if ((go version) -ne 'go version go1.26.5 windows/amd64') { throw "Unexpected Go: $(go version)" }
          git --version

      - name: Run Windows smoke tests
        run: go test ./...
