version: "3"

tasks:
  build:
    desc: Build all packages
    cmds:
      - go build ./...

  bundle:
    desc: >
      Build the single double-clickable venom.exe with the dashboard embedded:
      dashboard:build-embed, then `go build -ldflags "-H windowsgui"`. Run it
      and double-click the exe — bare `venom` starts the server + system tray
      (P6-FND-001). The GUI subsystem has two consequences: (a) double-click /
      autostart launch is fully silent — no console and no Windows Terminal
      window (ShowWindow-based hiding cannot touch WT, the Win11 default
      console host); (b) CLI modes (serve, version, help, reset-owner) run
      from a terminal still PRINT via the parent-console attach in
      cmd/venom/console_windows.go, but the shell prompt does not wait for a
      GUI-subsystem process — PowerShell users who need blocking should use
      `Start-Process -Wait` or a console build via plain `go build`. Plain
      `go build ./cmd/venom` (dev/CI) stays console-subsystem — CI is
      untouched.
    cmds:
      - task: dashboard:build-embed
      - go build -ldflags "-H windowsgui" -o dist/venom.exe ./cmd/venom
      - 'echo "built dist/venom.exe — double-click it to start Venom in the tray"'

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run

  dashboard:build-embed:
    desc: >
      P2a-UI-001: builds the dashboard (Vite) and copies its dist/
      output into internal/httpui/dist/ so `go:embed` packages it into
      the single binary. @venom/design-system is built first since
      dashboard depends on its dist/ output (P2a-DS-001). Must run
      before building/running the binary with a real embedded
      dashboard — without it, internal/httpui.New() fails closed with a
      clear error at Boot's validate_embedded_assets stage (the
      compile itself still succeeds via the committed
      internal/httpui/dist/.buildmarker placeholder, so `go build`/
      `go vet`/`go test` never require this task to have run).
    cmds:
      - |
        set -e
        echo "== building @venom/design-system (dashboard's file: dependency) =="
        (cd Design_System && npm run build)
        echo "== building dashboard =="
        (cd dashboard && npm run build)
        echo "== copying dashboard/dist -> internal/httpui/dist (preserving .buildmarker) =="
        node -e "
          const fs = require('node:fs');
          const dest = 'internal/httpui/dist';
          for (const entry of fs.readdirSync(dest)) {
            if (entry === '.buildmarker') continue;
            fs.rmSync(dest + '/' + entry, { recursive: true, force: true });
          }
          fs.cpSync('dashboard/dist', dest, { recursive: true });
        "
        echo "== dashboard:build-embed: internal/httpui/dist now holds the real dashboard build =="

  vendor-check:
    desc: Fail if third_party/bifrost has drifted from its pinned commit or been locally modified
    cmds:
      - |
        set -e
        if git submodule status third_party/bifrost | grep -qE '^[+\-U]'; then
          echo "third_party/bifrost is not pinned cleanly:" >&2
          git submodule status third_party/bifrost >&2
          exit 1
        fi
        if [ -n "$(git -C third_party/bifrost status --porcelain)" ]; then
          echo "third_party/bifrost has local modifications:" >&2
          git -C third_party/bifrost status --porcelain >&2
          exit 1
        fi
        echo "third_party/bifrost: clean, pinned at $(git -C third_party/bifrost rev-parse HEAD)"

  gate:
    desc: >
      The single blocking static-invariants gate (P0-TEST-001): gofmt,
      goimports, go vet, golangci-lint (incl. the no-panic/no-fmt.Print*/
      no-os.Getenv-outside-config-or-platform forbidigo rules), the
      import-layering test, the no-slug-switch check, and the P1-SEC-006
      secret canary (the latter three run as part of `go test ./...`,
      since they are regular Go tests — under internal/staticgate,
      internal/execution, and internal/secrets [package secrets_test]
      respectively). CI invokes exactly this one command on the genuine
      Linux self-hosted gate; a separate Windows smoke job runs
      `CGO_ENABLED=0 go test ./...`. No gate logic is duplicated in the CI
      workflow file. The race detector (CGO_ENABLED=1) remains separate
      and non-blocking because it needs a C toolchain. schema-lint and
      no-hardcoding remain reserved placeholders (see the `schema-lint`
      and `no-hardcoding-lint` tasks below) — not part of this gate until
      populated in P3.
    cmds:
      - |
        set -e

        echo "== gofmt =="
        UNFORMATTED=$(gofmt -l ./internal)
        if [ -n "$UNFORMATTED" ]; then
          echo "gofmt would reformat the following files:" >&2
          echo "$UNFORMATTED" >&2
          exit 1
        fi

        echo "== goimports =="
        UNORGANIZED=$(goimports -l ./internal)
        if [ -n "$UNORGANIZED" ]; then
          echo "goimports would change the following files:" >&2
          echo "$UNORGANIZED" >&2
          exit 1
        fi

        echo "== go vet =="
        go vet ./...

        echo "== golangci-lint =="
        golangci-lint run

        echo "== go test (includes the layering test and no-slug-switch check) =="
        go test ./...

        echo "== gate: all static invariants green =="

  test-race:
    desc: >
      Race detector (test-only). Requires CGO_ENABLED=1 — a build-time
      requirement of Go's race detector, not a change to production
      builds, which stay CGO_ENABLED=0. Wired into CI for both Windows
      and Linux as its own step (see .github/workflows/ci.yml), separate
      from `gate`, since it needs a working C toolchain to even compile
      and `gate` must stay green on hosts without one.
    cmds:
      - CGO_ENABLED=1 go test -race ./...

  p6-gate:
    desc: >
      P6-TEST-002: the operate-without-terminal phase gate, CI-deterministic
      half — ONE command, as the card asks. Runs the step-ordered lifecycle
      scenario (setup -> connect a provider -> discover -> probe -> route a
      request -> read diagnostics -> create a key -> connect a client) against
      FAKE provider backends with an owner the test provisions itself, plus the
      byte-level DB canary over the whole run.

      It also runs the OPT-IN live harness, which SKIPS unless
      VENOM_E2E_REAL_SDK_BASE_URL and VENOM_E2E_REAL_SDK_KEY are both set — the
      -v flag is deliberate so that skip is visible in the output rather than
      being mistaken for a pass. The dated manual procedure for the half only a
      human on a Windows desktop can witness (the tray, silent launch, a real
      provider account) is
      docs/evidence/P6-TEST-002-operate-without-terminal-runbook.md.

      `gate`'s own `go test ./...` already runs all of this on every build, on
      both CI OSes — that is the authoritative always-on gate. This task is the
      fast, targeted signal.
    cmds:
      - go test ./internal/httpapi/ -run '^TestP6Gate_' -v

  schema-lint:
    desc: >
      RESERVED placeholder — schema-lint (nullable numerics mean
      unknown, append-only evidence tables keep exactly one current row,
      everything keys on account_id). Populated in P1; intentionally a
      no-op until then, and not part of `gate`.
    cmds:
      - 'echo "schema-lint: reserved placeholder, not yet implemented (lands in P1)"'

  no-hardcoding-lint:
    desc: >
      RESERVED placeholder — bans model-name/capability literals in
      routing/models and asserts no static model list exists. Populated
      in P3; intentionally a no-op until then, and not part of `gate`.
    cmds:
      - 'echo "no-hardcoding-lint: reserved placeholder, not yet implemented (lands in P3)"'

  secret-canary:
    desc: >
      P1-SEC-006: mechanically proves a known injected secret never
      survives the leak paths that exist at P1 — encryption (the
      envelope + Encrypt/Decrypt/Load errors) and structured logging
      through the sanitize boundary (internal/secrets/canary_test.go,
      package secrets_test). Trace and audit leak paths don't exist yet
      (tracing is later, the audit log lands with M2/P2b) and are noted
      as extension points there rather than faked. This task runs just
      the canary tests directly for a fast, targeted signal; `gate`'s
      `go test ./...` already runs them on every build, on both CI OSes
      — that is the authoritative "runs forever after" gate for this
      unit.
    cmds:
      - go test -run '^(TestCanaryDetector_|TestSecretCanary_)' ./internal/... -v
